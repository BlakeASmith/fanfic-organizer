<div id="scrape-session" hx-ext="sse" sse-connect="/scrape/events/{{ scrape_id }}" sse-close="done">
  <div hidden sse-swap="start status error done"></div>
  <div id="results-section" class="visible">
    <h2>Results (<span id="result-count">0</span> works)</h2>
    <div id="results-summary" class="summary"></div>

    <div class="copy-actions">
      <button type="button" id="copy-links-btn" class="copy-btn" disabled>Copy links</button>
      <button type="button" id="copy-data-btn" class="copy-btn" disabled>Copy full data</button>
      <label class="delay-inline">
        Min request gap (s)
        <input type="number" id="epub_delay" name="epub_delay" value="1.5" min="0" step="0.1" title="AO3 request delay (default 1.5s)">
      </label>
      <button
        type="button"
        id="download-zip-btn"
        class="zip-btn"
        disabled
        hx-post="/download/start"
        hx-target="#download-live"
        hx-swap="innerHTML"
        hx-include="#username, #password, #epub_delay"
        hx-on:htmx:config-request="event.detail.parameters.jsonl = document.getElementById('jsonl-output').textContent"
        hx-on:htmx:before-request="this.disabled = true"
        hx-on:htmx:after-request="if (!event.detail.successful) updateCopyButtons()"
      >Download EPUBs &amp; zip</button>
    </div>
    <div id="download-live"></div>

    <table>
      <thead>
        <tr>
          <th>Score</th>
          <th>Title</th>
          <th>Author</th>
          <th>Chapters</th>
          <th>Words</th>
          <th>Kudos</th>
          <th>Hits</th>
        </tr>
      </thead>
      <tbody id="results-body" hx-swap="beforeend" sse-swap="work"></tbody>
    </table>

    <h2 id="json-output">JSONL output</h2>
    <pre id="jsonl-output" class="jsonl-output"></pre>
  </div>
</div>
