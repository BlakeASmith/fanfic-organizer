<div id="status-panel" class="visible done" hx-swap-oob="outerHTML">
  EPUBs ready — {{ downloaded }} downloaded, {{ skipped }} skipped, {{ failed }} failed.
  <a href="/download/{{ download_id }}/zip">Download ao3-import.zip</a>
  for the Calibre plugin.
</div>
<pre id="remap-summary" class="jsonl-output">{{ remappings }}</pre>
<pre id="jsonl-output" class="jsonl-output" hx-swap-oob="innerHTML">{{ jsonl }}</pre>
<p>
  Import <a href="/download/{{ download_id }}/zip">ao3-import.zip</a>
  in Calibre (AO3 Scraper → Import JSONL or zip). Records now include
  <code>epub_file</code> paths.
</p>
