<div id="status-panel" class="visible" hx-swap-oob="outerHTML">{{ message }}</div>
<div id="results-summary" class="summary" hx-swap-oob="innerHTML">
  {% if search_url %}
  Search URL: <a href="{{ search_url }}" target="_blank" rel="noopener">{{ search_url }}</a>
  {% endif %}
</div>
<tbody id="results-body" hx-swap-oob="innerHTML"></tbody>
<pre id="jsonl-output" class="jsonl-output" hx-swap-oob="innerHTML"></pre>
<span id="result-count" hx-swap-oob="innerHTML">0</span>
<div id="download-live" hx-swap-oob="innerHTML"></div>
