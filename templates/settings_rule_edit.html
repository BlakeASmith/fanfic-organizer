<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit {{ name }} — AO3 Scraper</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem;
      background: #faf8f5;
      color: #2c2c2c;
      line-height: 1.5;
    }
    h1 { margin-top: 0; font-size: 1.5rem; }
    nav { margin-bottom: 1rem; }
    nav a { color: #7b0022; margin-right: 1rem; }
    textarea {
      width: 100%;
      min-height: 28rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem;
      padding: 0.75rem;
      border: 1px solid #aaa;
      background: #fff;
    }
    button {
      background: #7b0022;
      color: #fff;
      border: none;
      padding: 0.65rem 1.25rem;
      font: inherit;
      cursor: pointer;
      margin-top: 0.75rem;
      margin-right: 0.5rem;
    }
    button:hover { background: #5a0018; }
    button.secondary { background: #3e8fb0; }
    .flash {
      padding: 0.75rem 1rem;
      margin: 1rem 0;
      border: 1px solid #3e8fb0;
      background: #eef6f9;
    }
    .flash.error { border-color: #eb6f92; background: #fde8ec; }
    .hint { font-size: 0.85rem; color: #666; }
    .path { font-family: monospace; font-size: 0.85rem; }
    .checkbox { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.75rem; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Scraper</a>
    <a href="/settings">Settings</a>
  </nav>
  <h1>Edit rule: {{ name }}.py</h1>
  <p class="hint path">{{ path }}</p>

  {% if message %}
  <div class="flash {% if error %}error{% endif %}">{{ message }}</div>
  {% endif %}

  <form method="post" action="/settings/rules/{{ name }}">
    <textarea name="source" spellcheck="false">{{ source }}</textarea>
    <div class="checkbox">
      <input type="checkbox" name="make_active" id="make_active" value="1"
             {% if is_active %}checked{% endif %}>
      <label for="make_active">Use as active rules module</label>
    </div>
    <button type="submit">Save</button>
    <a href="/settings"><button type="button" class="secondary">Back</button></a>
  </form>
</body>
</html>
