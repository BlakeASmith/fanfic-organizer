name: PR plugin build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute PR zip metadata
        id: meta
        run: |
          python -m calibre_dev.ci pr-meta \
            --pr "${{ github.event.pull_request.number }}" \
            --sha "${{ github.sha }}"
      - name: Build plugin zip
        run: |
          python makeplugin.py zip \
            --set-version "${{ steps.meta.outputs.version }}" \
            --output "${{ steps.meta.outputs.zip_name }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ steps.meta.outputs.zip_name }}
          if-no-files-found: error
          retention-days: 14
      - name: Comment download link on the PR
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const marker = '<!-- fanfic-organizer-pr-build -->';
            const zipName = '${{ steps.meta.outputs.zip_name }}';
            const version = '${{ steps.meta.outputs.version }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '## PR plugin build',
              '',
              `Test zip: \`${zipName}\``,
              `Calibre plugin version: \`${version}\``,
              '',
              'This is a **CI test build**, not a GitHub release or pre-release.',
              'Prefer a [standard release](https://github.com/${{ github.repository }}/releases/latest) for daily use.',
              '',
              `- [Download the artifact from this run](${runUrl})`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user &&
                comment.user.login === 'github-actions[bot]' &&
                comment.body &&
                comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
