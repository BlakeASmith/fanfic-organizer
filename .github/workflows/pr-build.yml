name: PR plugin build

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute PR zip metadata
        id: meta
        run: |
          python -m calibre_dev.ci pr-meta \
            --pr "${{ github.event.pull_request.number }}" \
            --sha "${{ github.sha }}" \
            --pr-url "${{ github.event.pull_request.html_url }}" \
            --notes-file "${{ runner.temp }}/pr-notes.md"
      - name: Build plugin zip
        run: |
          python makeplugin.py zip \
            --set-version "${{ steps.meta.outputs.version }}" \
            --output "${{ steps.meta.outputs.zip_name }}"
      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.meta.outputs.notes_file }}
          files: ${{ steps.meta.outputs.zip_name }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Comment download link on the PR
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const marker = '<!-- fanfic-organizer-pr-build -->';
            const zipName = '${{ steps.meta.outputs.zip_name }}';
            const version = '${{ steps.meta.outputs.version }}';
            const downloadUrl = '${{ steps.meta.outputs.download_url }}';
            const htmlUrl = '${{ steps.meta.outputs.html_url }}';
            const body = [
              marker,
              '## PR plugin pre-release',
              '',
              `Calibre plugin version: \`${version}\``,
              '',
              `[Download ${zipName}](${downloadUrl})`,
              '',
              `GitHub pre-release: [${version}](${htmlUrl})`,
              '',
              'This is a **PR test build** (`X.Y.Z-pr.<n>+<sha>`), marked as a GitHub pre-release.',
              'Enable **Include preview pre-releases** in **Check for updates…** to install it from the plugin.',
              'Prefer a [standard release](https://github.com/${{ github.repository }}/releases/latest) for daily use.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user &&
                comment.user.login === 'github-actions[bot]' &&
                comment.body &&
                comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
