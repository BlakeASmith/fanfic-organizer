name: Release plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build fanfic-organizer.zip
        run: python makeplugin.py zip
      - name: Changelog notes
        if: startsWith(github.ref, 'refs/tags/')
        run: python makeplugin.py changelog "${GITHUB_REF_NAME#v}" > /tmp/release-notes.md
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fanfic-organizer
          path: fanfic-organizer.zip
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: fanfic-organizer.zip
          body_path: /tmp/release-notes.md
          generate_release_notes: false
